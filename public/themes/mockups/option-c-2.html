<!DOCTYPE html>
<html>
<head>
<style>
  body { background: url('/themes/trax-wood-bg.jpg') center / cover fixed no-repeat; min-height: 100vh; padding: 20px; font-family: sans-serif; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 400px; margin: 0 auto; }
  .card-cell { display: flex; flex-direction: column; align-items: center; }
  .card-img { width: 100%; aspect-ratio: 5/7; object-fit: cover; border-radius: 8px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); margin-bottom: 8px; background: #333; }
  .title { font-family: serif; color: #f5ecd9; font-size: 14px; font-weight: 500; margin: 0 0 4px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.7); font-style: italic; text-align: center; }
  .price { color: #f5ecd9; font-size: 16px; font-weight: bold; margin: 0 0 4px 0; text-shadow: 0 1px 3px rgba(0,0,0,0.7); text-align: center; }
  .condition { color: #a08055; font-size: 11px; margin: 0; text-shadow: 0 1px 3px rgba(0,0,0,0.7); text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="card-cell">
    <img src="https://placehold.co/400x550/111111/FFFFFF/png?text=Card+1" class="card-img" />
    <p class="title">1984 Donruss</p>
    <p class="price">$2.00</p>
    <p class="condition">Near Mint or Better</p>
  </div>
  <div class="card-cell">
    <img src="https://placehold.co/400x550/111111/FFFFFF/png?text=Card+2" class="card-img" />
    <p class="title">1989 Upper Deck</p>
    <p class="price">$5.00</p>
    <p class="condition">Excellent</p>
  </div>
  <div class="card-cell">
    <img src="https://placehold.co/400x550/111111/FFFFFF/png?text=Card+3" class="card-img" />
    <p class="title">1993 SP Foil</p>
    <p class="price">$15.00</p>
    <p class="condition">PSA 9</p>
  </div>
  <div class="card-cell">
    <img src="https://placehold.co/400x550/111111/FFFFFF/png?text=Card+4" class="card-img" />
    <p class="title">2001 Topps Chrome</p>
    <p class="price">$50.00</p>
    <p class="condition">BGS 9.5</p>
  </div>
</div>
</body>
</html>
